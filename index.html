<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Orrery — 3D Solar System</title>
    <meta name="description" content="Fly through a real-time 3D solar system: every planet and major moon at true positions, from whole-system views down to a single moon." />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
      #app { position: fixed; inset: 0; }
      /* A 3D view, not a document: a stray double-click or ⌘A would select the
         page, and pressing on a selection (or a label) then starts the browser's
         own drag of a snapshot instead of turning the camera. */
      body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      canvas, img { -webkit-user-drag: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
